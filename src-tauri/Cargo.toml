[package]
name = "markreader"
version = "0.1.0"
description = "A standalone Markdown reader built from VS Code's Markdown preview"
authors = ["DigiGate"]
license = "GPL-3.0-only"
repository = "https://github.com/usamaiqb/markreader-desktop"
edition = "2021"
rust-version = "1.82"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify-debouncer-mini = "0.7"
percent-encoding = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_System_Console",
	"Win32_UI_Shell",
] }

[features]
# Ship devtools in a release build: `cargo build --release --features devtools`.
devtools = ["tauri/devtools"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
incremental = false

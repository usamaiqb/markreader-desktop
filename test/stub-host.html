<!--
	The stub host — the cheapest possible second consumer of the document module.

	A bare page: the `markdown-body` element, the document stylesheets, and a fake
	`window.markreader`. No toolbar, no sidebar, no outline pane, no find bar, no `app.css`,
	and no `shell.ts`. If `document.ts` renders here, it will render in an Android WebView,
	because this page gives it strictly less than one.

	That is what stops shell coupling creeping back: the moment `document.ts` reaches for an
	element only the desktop chrome has, this page breaks and the desktop app does not.

	It runs against the *unbundled* output, so a bare specifier that a bundler would have
	resolved and a browser will not is caught here rather than on a device.

	Open `out/renderer-esm/stub.html` after `npm run build:esm`. It needs a server rather than
	`file://`, because ES modules are fetched under CORS:

		npm run serve:esm     # then open http://localhost:8099/stub.html

	`?doc=rtl.md` picks another file from `samples/`, and `?theme=light` the light theme. The
	script is `stub-host.js`, copied alongside as `stub.js`: inline, the CSP below would block it.
-->
<html lang="en">

<head>
	<meta charset="UTF-8">
	<!-- The same policy the app page carries. `mdr:` is absent: this host serves document
	     resources from its own origin, which is what Android does too. -->
	<meta http-equiv="Content-Security-Policy"
		content="default-src 'none'; img-src 'self' data: https:; media-src 'self' data: https:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self';">
	<title>MarkReader — stub host</title>

	<!-- Exactly the document stylesheets. app.css is deliberately absent: if the document
	     needs a rule from it, that rule is in the wrong file. -->
	<link rel="stylesheet" href="css/markdown.css">
	<link rel="stylesheet" href="css/highlight.css">
	<link rel="stylesheet" href="css/theme.css">
	<link rel="stylesheet" href="css/document-overrides.css">
</head>

<body class="vscode-dark wordWrap">
	<div class="markdown-body" dir="auto" id="markdown-body"></div>

	<script type="module" src="./stub.js"></script>
</body>

</html>

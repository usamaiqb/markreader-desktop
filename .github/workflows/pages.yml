name: Pages

# Deploys site/ to GitHub Pages, with the app icon and the README screenshots copied in.
# Repository Settings → Pages → Source must be "GitHub Actions".

on:
  push:
    branches: [ main ]
    paths:
      - 'site/**'
      - 'metadata/screenshots/**'
      - 'src-tauri/icons/128x128.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Build and deploy are separate jobs. In one job, deploy-pages can look up the artifact before
# the upload is visible, and fail with "No artifacts named github-pages".
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assemble the site
        run: |
          mkdir -p _site/screenshots
          cp -r site/. _site/
          cp metadata/screenshots/*.png _site/screenshots/
          cp src-tauri/icons/128x128.png _site/icon.png

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

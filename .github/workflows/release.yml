name: Release

# TEMPORARILY DISABLED. No automatic triggers - nothing runs on push, PR or tag.
# A run can still be started by hand from the Actions tab.
#
# To re-enable, replace the `on:` block below with:
#
#   on:
#     push:
#       tags: [ 'v*' ]
#
on:
  workflow_dispatch:

permissions:
  contents: write   # required to create the GitHub Release

jobs:
  check-version:
    name: Version files in sync
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "❌ Tag '${GITHUB_REF_NAME}' does not match package.json version '$PKG'"
            exit 1
          fi
          echo "✅ Tag matches package.json: $TAG"

      - name: Install Node dependencies
        run: npm ci

      - name: Check version consistency
        run: npm run check:version

      - name: Working tree clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "❌ Working tree has uncommitted changes:"
            git status --porcelain
            exit 1
          fi
          echo "✅ Working tree clean"

  build:
    name: Build ${{ matrix.artifact }}
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            artifact: windows
          - os: ubuntu-24.04
            bundles: deb,appimage
            artifact: linux
          - os: macos-latest
            bundles: dmg
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          # Required when pinned by SHA - see the same step in ci.yml.
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb

      - name: Install Node dependencies
        run: npm ci

      # Guard: the exact tagged commit is re-tested before we ship. Lint/typecheck
      # are static and already covered on the PR, so only the dynamic suite runs.
      - name: Smoke test
        if: runner.os != 'Linux'
        run: npm test

      - name: Smoke test (headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: Bundle installers
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: markreader-${{ matrix.artifact }}
          path: |
            src-tauri/target/release/markreader
            src-tauri/target/release/markreader.exe
            src-tauri/target/release/bundle/**

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth: 0 so auto-generated release notes can find the previous tag
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # Auto-generated notes: categorized PR list (per .github/release.yml) +
      # "New Contributors" + compare link. CHANGELOG.md is kept in-repo for
      # convention; the Release page is the auto-generated view.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/**

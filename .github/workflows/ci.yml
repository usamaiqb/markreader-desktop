name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

# Cancel superseded PR runs, but let main runs finish (keeps default-branch
# history/badge complete and warms the shared caches).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-version:
    name: Version files in sync
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Check version consistency
        run: npm run check:version

  build:
    name: Test, verify & package
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            artifact: windows
          - os: ubuntu-24.04
            bundles: deb,appimage
            artifact: linux
          - os: macos-latest
            bundles: dmg
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          # Required when the action is pinned by SHA: it cannot infer the toolchain
          # from the ref the way dtolnay/rust-toolchain@stable does.
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Frontend unit tests
        run: npm run test:unit

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Unit tests (Rust)
        working-directory: src-tauri
        run: cargo test

      - name: Build frontend
        run: npm run build

      - name: Smoke test
        if: runner.os != 'Linux'
        run: npm test

      - name: Smoke test (headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: Build release binary
        run: npm run package:dir

      - name: Verify packaged app
        if: runner.os != 'Linux'
        run: npm run verify:packaged

      - name: Verify packaged app (headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run verify:packaged

      - name: Bundle installers
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: markreader-${{ matrix.artifact }}
          path: |
            src-tauri/target/release/markreader
            src-tauri/target/release/markreader.exe
            src-tauri/target/release/bundle/**

version: 2
updates:
  # Keep pinned GitHub Actions up to date (and lets you safely move to SHA pins).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Keep the frontend toolchain and Tauri CLI in sync.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  # Keep the Rust crates (including Tauri) current.
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    commit-message:
      prefix: build
